name: Contribution snake

# Draws the contribution graph as a snake in rainbow colours,
# once a day and on demand, and publishes the SVGs to the `output` branch.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#7c3aed&color_dots=#ebedf0,#38bdf8,#34d399,#fbbf24,#f472b6&color_dot_border=#00000000
            dist/snake-dark.svg?color_snake=#c4b5fd&color_dots=#161b22,#0ea5e9,#10b981,#f59e0b,#ec4899&color_dot_border=#00000000

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          author: SUDARSUN-24 <190239857+SUDARSUN-24@users.noreply.github.com>
          committer: SUDARSUN-24 <190239857+SUDARSUN-24@users.noreply.github.com>
          commit_message: Update contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
